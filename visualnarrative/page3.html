<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titanic Survival - Intersection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body id="page-intersection">
    <div id="app">
        <header>
            <h1>Titanic Survival Rate: Gender The Strongest Factor</h1>
            <p id="narrative-text">Loading...</p>
        </header>

        <main>
            <div id="controls" style="margin-bottom: 20px;">
                <div class="control-group">
                    <label for="class-filter">Class:</label>
                    <select id="class-filter">
                        <option value="All">All</option>
                        <option value="First">1st Class</option>
                        <option value="Second">2nd Class</option>
                        <option value="Third">3rd Class</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="sex-filter">Gender:</label>
                    <select id="sex-filter">
                        <option value="All">All</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="embark-filter">Embark Town:</label>
                    <select id="embark-filter">
                        <option value="All">All</option>
                        <option value="Southampton">Southampton</option>
                        <option value="Cherbourg">Cherbourg</option>
                        <option value="Queenstown">Queenstown</option>
                    </select>
                </div>
            </div>

            <div id="chart-container">
                <!-- SVG chart will be injected here by D3 -->
            </div>
            
            <div id="navigation">
                <a href="page2.html" class="nav-btn">Previous</a>
                <div id="step-indicators">
                    <span class="step"></span>
                    <span class="step"></span>
                    <span class="step active"></span>
                </div>
            </div>
        </main>
    </div>


    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-annotation/2.5.1/d3-annotation.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <script src="app.js"></script>
</body>
</html>
